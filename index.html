<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vote Réunion · Data</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0f0f11; --surface:#1a1a1f; --surface2:#22222a;
  --border:rgba(255,255,255,0.08); --border2:rgba(255,255,255,0.14);
  --text:#f0eff5; --muted:#888799;
  --accent:#7c6fff; --accent2:#a695ff;
  --green:#3dd68c; --red:#ff6b6b; --amber:#ffc94d;
  --radius:14px; --radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* ── CONFIG ── */
#config-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background:radial-gradient(ellipse at 50% 0%,#1e1830 0%,var(--bg) 60%);}
.config-box{background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:2.5rem;width:100%;max-width:480px;}
.config-box h1{font-size:22px;font-weight:600;margin-bottom:6px;letter-spacing:-0.3px;}
.config-box p{font-size:14px;color:var(--muted);margin-bottom:2rem;line-height:1.6;}
.config-box label{display:block;font-size:12px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;}
.config-box input,.config-box textarea{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-family:'DM Mono',monospace;font-size:13px;padding:10px 12px;outline:none;transition:border-color .2s;margin-bottom:1.25rem;}
.config-box textarea{height:130px;resize:vertical;}
.config-box input:focus,.config-box textarea:focus{border-color:var(--accent);}
.notice{background:rgba(124,111,255,.1);border:1px solid rgba(124,111,255,.25);border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;color:var(--accent2);margin-bottom:1.5rem;line-height:1.6;}
.btn-primary{width:100%;padding:12px;background:var(--accent);color:white;border:none;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer;transition:opacity .2s,transform .15s;}
.btn-primary:hover{opacity:.9;}
.btn-primary:active{transform:scale(.99);}

/* ── APP ── */
#app{display:none;min-height:100vh;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border);background:rgba(15,15,17,.92);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;}
.topbar-left{display:flex;align-items:center;gap:12px;}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:livepulse 2s infinite;}
@keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(61,214,140,.4);}70%{box-shadow:0 0 0 8px rgba(61,214,140,0);}100%{box-shadow:0 0 0 0 rgba(61,214,140,0);}}
.live-label{font-size:12px;font-weight:500;color:var(--green);letter-spacing:.06em;text-transform:uppercase;}
.session-id{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);background:var(--surface);padding:4px 10px;border-radius:20px;border:1px solid var(--border);cursor:pointer;transition:border-color .2s;}
.session-id:hover{border-color:var(--border2);}
.presenter-badge{font-size:12px;color:var(--amber);background:rgba(255,201,77,.1);border:1px solid rgba(255,201,77,.25);padding:4px 10px;border-radius:20px;}
.main{max-width:800px;margin:0 auto;padding:2rem 1.25rem 4rem;}

/* ── STATS ── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:1.5rem;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;}
.stat-card .num{font-size:28px;font-weight:600;line-height:1;margin-bottom:4px;font-variant-numeric:tabular-nums;}
.stat-card .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}

/* ── ADD FORM ── */
.add-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:1rem;}
.add-row{display:flex;gap:8px;flex-wrap:wrap;}
.add-row input,.add-row select{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;padding:10px 14px;outline:none;transition:border-color .2s;}
.add-row input:focus,.add-row select:focus{border-color:var(--accent);}
.add-row input::placeholder{color:var(--muted);}
#new-topic{flex:1;min-width:180px;}
#new-author{width:130px;}
#new-cat{width:210px;cursor:pointer;}
#new-cat option{background:#22222a;}
.btn-add{padding:10px 20px;background:var(--accent);color:white;border:none;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:opacity .2s;white-space:nowrap;}
.btn-add:hover{opacity:.88;}

/* ── CATEGORY TAGS ── */
.cat-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:2px 9px;border-radius:20px;white-space:nowrap;letter-spacing:.02em;}
.cat-arch  {background:rgba(55,138,221,.15);color:#85b7eb;border:1px solid rgba(55,138,221,.25);}
.cat-ia    {background:rgba(124,111,255,.15);color:#a695ff;border:1px solid rgba(124,111,255,.25);}
.cat-gouv  {background:rgba(61,214,140,.12);color:#3dd68c;border:1px solid rgba(61,214,140,.22);}
.cat-strat {background:rgba(255,201,77,.12);color:#ffc94d;border:1px solid rgba(255,201,77,.22);}
.cat-autre {background:rgba(136,135,153,.12);color:#888799;border:1px solid rgba(136,135,153,.22);}

/* ── FILTER BAR ── */
.filter-bar{display:flex;align-items:center;gap:6px;margin-bottom:.75rem;flex-wrap:wrap;}
.filter-lbl{font-size:12px;color:var(--muted);}
.filter-chip{font-size:12px;padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;}
.filter-chip.active{background:var(--surface2);border-color:var(--border2);color:var(--text);}
.filter-chip.cat-arch.active  {background:rgba(55,138,221,.2);border-color:rgba(55,138,221,.4);color:#85b7eb;}
.filter-chip.cat-ia.active    {background:rgba(124,111,255,.2);border-color:rgba(124,111,255,.4);color:#a695ff;}
.filter-chip.cat-gouv.active  {background:rgba(61,214,140,.15);border-color:rgba(61,214,140,.35);color:#3dd68c;}
.filter-chip.cat-strat.active {background:rgba(255,201,77,.15);border-color:rgba(255,201,77,.35);color:#ffc94d;}
.filter-chip.cat-autre.active {background:rgba(136,135,153,.15);border-color:rgba(136,135,153,.3);color:#aaa;}

/* ── SORT ── */
.sort-row{display:flex;align-items:center;gap:6px;margin-bottom:1rem;}
.sort-lbl{font-size:12px;color:var(--muted);}
.sort-chip{font-size:12px;padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;}
.sort-chip.active{background:var(--surface2);border-color:var(--border2);color:var(--text);}

/* ── TOPIC CARDS ── */
.topics{display:flex;flex-direction:column;gap:10px;}
.topic-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;display:flex;align-items:center;gap:14px;transition:border-color .2s;animation:slideIn .25s ease;}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
.topic-card:hover{border-color:var(--border2);}
.rank{font-size:14px;color:var(--muted);min-width:24px;text-align:center;font-variant-numeric:tabular-nums;}
.topic-body{flex:1;min-width:0;}
.topic-text{font-size:14px;font-weight:500;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topic-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.author-chip{background:var(--surface2);border-radius:20px;padding:1px 8px;font-size:11px;color:var(--muted);}
.bar-wrap{width:72px;flex-shrink:0;}
.bar-bg{height:3px;background:var(--surface2);border-radius:2px;overflow:hidden;margin-bottom:4px;}
.bar-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s cubic-bezier(.34,1.56,.64,1);}
.bar-count{font-size:11px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;}
.vote-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;}
.vote-btn:hover{border-color:var(--accent);color:var(--accent2);}
.vote-btn.voted{border-color:var(--accent);background:rgba(124,111,255,.12);color:var(--accent2);}
.vote-btn svg{width:14px;height:14px;flex-shrink:0;}
.del-btn{background:transparent;border:none;color:var(--muted);cursor:pointer;padding:6px;border-radius:6px;opacity:0;transition:opacity .15s,color .15s;}
.topic-card:hover .del-btn{opacity:1;}
.del-btn:hover{color:var(--red);background:rgba(255,107,107,.1);}
.del-btn svg{width:14px;height:14px;display:block;}

/* ── CATEGORY GROUPS ── */
.cat-group{margin-bottom:1.5rem;}
.cat-group-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:0 2px;}
.cat-group-title{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;}
.cat-group-count{font-size:11px;color:var(--muted);}

/* ── EMPTY ── */
.empty{text-align:center;padding:3rem 1rem;color:var(--muted);font-size:14px;line-height:2;}

/* ── VIEW TOGGLE ── */
.view-toggle{display:flex;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:3px;}
.view-toggle button{font-size:12px;padding:4px 12px;border-radius:20px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;}
.view-toggle button.active{background:var(--accent);color:white;}

/* ── PRESENTER ── */
#presenter-view{display:none;}
.presenter-topic{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px 24px;display:flex;align-items:center;gap:16px;margin-bottom:10px;transition:border-color .2s;}
.presenter-topic.top1{border-color:rgba(124,111,255,.4);background:rgba(124,111,255,.06);}
.presenter-rank{font-size:28px;min-width:40px;text-align:center;}
.presenter-text{flex:1;font-size:20px;font-weight:500;}
.presenter-bar-wrap{width:100px;}
.presenter-bar-bg{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-bottom:5px;}
.presenter-bar-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .5s cubic-bezier(.34,1.56,.64,1);}
.presenter-votes{font-size:22px;font-weight:600;color:var(--accent2);min-width:50px;text-align:right;font-variant-numeric:tabular-nums;}

/* ── SHARE ── */
.share-panel{background:rgba(124,111,255,.06);border:1px solid rgba(124,111,255,.2);border-radius:var(--radius);padding:14px 18px;margin-bottom:1.5rem;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--accent2);}
.share-url{font-family:'DM Mono',monospace;font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);}
.copy-btn{font-size:12px;padding:5px 12px;border-radius:var(--radius-sm);border:1px solid rgba(124,111,255,.3);background:transparent;color:var(--accent2);cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;transition:background .15s;}
.copy-btn:hover{background:rgba(124,111,255,.12);}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface2);border:1px solid var(--border2);color:var(--text);padding:10px 18px;border-radius:100px;font-size:13px;font-weight:500;z-index:999;transition:transform .3s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}

@media(max-width:600px){
  .stats{gap:8px;}
  .stat-card .num{font-size:22px;}
  .add-row{flex-direction:column;}
  #new-author,#new-cat{width:100%;}
  .presenter-text{font-size:16px;}
}
</style>
</head>
<body>

}</textarea>

<!-- ═══ APP ═══ -->
<div id="app">

      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
      <span class="share-url" id="share-url-text">—</span>

    <div class="stats">
      <div class="stat-card"><div class="num" id="st-topics" style="color:var(--accent2)">0</div><div class="lbl">Sujets</div></div>

      <div class="stat-card"><div class="num" id="st-voters" style="color:var(--amber)">0</div><div class="lbl">Votants</div></div>

    <div id="normal-view">

          </select>
          <button class="btn-add" onclick="addTopic()">+ Ajouter</button>

      <div class="filter-bar" id="filter-bar">
        <span class="filter-lbl">Filtrer :</span>
        <button class="filter-chip active" onclick="setFilter('all',this)" data-cat="all">Tous</button>
        <button class="filter-chip cat-arch" onclick="setFilter('Architecture &amp; Engineering',this)" data-cat="Architecture &amp; Engineering">🔧 Architecture</button>

    <!-- Vue présentateur -->
    <div id="presenter-view">
      <div class="topics" id="presenter-list"></div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script>
// ── CATEGORIES ────────────────────────────────────
const CATS = {
  "Architecture & Engineering": { cls: "cat-arch",  icon: "🔧" },
  "IA & Analytics":             { cls: "cat-ia",    icon: "🤖" },
  "Gouvernance & Qualité":      { cls: "cat-gouv",  icon: "🛡️" },
  "Tendances & Stratégie":      { cls: "cat-strat", icon: "🚀" },
  "Autre":                      { cls: "cat-autre", icon: "💬" },
};
function catInfo(cat) { return CATS[cat] || { cls: "cat-autre", icon: "💬" }; }

// ── STATE ─────────────────────────────────────────
let db=null, topicsRef=null, topics={};
let myId='u_'+Math.random().toString(36).slice(2,10);
let myName='Anonyme', sessionCode='', sortMode='votes', filterCat='all', isDemo=false;

// ── DEMO ──────────────────────────────────────────
function startDemo() {
  isDemo=true; myName='Demo'; sessionCode='demo';
  topics={
    't1':{text:"MCP (Model Context Protocol) — le nouveau standard d'intégration IA/données",author:'Architecture & Engineering',name:'Marie',votes:5,voters:{u1:1,u2:1,u3:1,u4:1,u5:1},ts:Date.now()-5000},
    't2':{text:'LLMs sur données internes — RAG, fine-tuning ou prompt engineering ?',author:'IA & Analytics',name:'Alex',votes:4,voters:{u1:1,u3:1,u4:1,u6:1},ts:Date.now()-4000},
    't3':{text:'Data Contracts — formaliser les SLAs entre producteurs et consommateurs',author:'Gouvernance & Qualité',name:'Charly',votes:2,voters:{u2:1,u5:1},ts:Date.now()-3000},
  };
  launchApp();
}

// ── FIREBASE ──────────────────────────────────────
function startApp() {
  const raw=document.getElementById('firebase-config').value.trim();
  myName=document.getElementById('presenter-name').value.trim()||'Présentateur';
  sessionCode=document.getElementById('session-code').value.trim().replace(/\s+/g,'-')||'reunion-'+Date.now();
  let config;
  try { config=JSON.parse(raw); } catch(e){ toast('JSON invalide'); return; }
  try {
    if(!firebase.apps.length) firebase.initializeApp(config);
    db=firebase.database();
    topicsRef=db.ref('sessions/'+sessionCode+'/topics');
    topicsRef.on('value',snap=>{ topics=snap.val()||{}; renderAll(); updateStats(); });
    launchApp();
  } catch(e){ toast('Erreur Firebase: '+e.message); console.error(e); }
}

function launchApp() {
  document.getElementById('config-screen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('session-display').textContent='# '+sessionCode;
  document.getElementById('user-name-badge').textContent=myName;
  document.getElementById('share-url-text').textContent=window.location.href.split('?')[0]+'?session='+encodeURIComponent(sessionCode);
  document.getElementById('new-author').value=myName;
  if(isDemo){ renderAll(); updateStats(); }
}

// ── URL PARAMS ────────────────────────────────────
window.addEventListener('DOMContentLoaded',()=>{
  const p=new URLSearchParams(window.location.search);
  const s=p.get('session'), n=p.get('name');
  if(s){ document.getElementById('session-code').value=s; }
  if(n){ document.getElementById('presenter-name').value=decodeURIComponent(n); }
  if(s){ startApp(); }
});

// ── ADD ───────────────────────────────────────────
function addTopic() {
  const input=document.getElementById('new-topic');
  const authorEl=document.getElementById('new-author');
  const catEl=document.getElementById('new-cat');
  const text=input.value.trim();
  const name=authorEl.value.trim()||myName||'Anonyme';
  const category=catEl.value;
  if(!text){ input.focus(); return; }
  const t={ text, name, author: category, votes:0, voters:{}, ts:Date.now() };
  if(isDemo){ topics['t'+Date.now()]=t; renderAll(); updateStats(); }
  else topicsRef.push(t);
  input.value=''; input.focus();
}

// ── VOTE ──────────────────────────────────────────
function vote(id) {
  const t=topics[id]; if(!t) return;
  const voted=t.voters&&t.voters[myId];
  if(isDemo){
    if(voted){ delete topics[id].voters[myId]; topics[id].votes=Math.max(0,topics[id].votes-1); }
    else { if(!topics[id].voters)topics[id].voters={}; topics[id].voters[myId]=1; topics[id].votes++; }
    renderAll(); updateStats();
  } else {
    const ref=topicsRef.child(id);
    if(voted){ ref.child('voters/'+myId).remove(); ref.child('votes').transaction(v=>Math.max(0,(v||0)-1)); }
    else { ref.child('voters/'+myId).set(1); ref.child('votes').transaction(v=>(v||0)+1); }
  }
}

// ── DELETE ────────────────────────────────────────
function deleteTopic(id) {
  if(isDemo){ delete topics[id]; renderAll(); updateStats(); }
  else topicsRef.child(id).remove();
}

// ── SORT / FILTER ─────────────────────────────────
function setSort(mode,btn){ sortMode=mode; document.querySelectorAll('.sort-chip').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); renderAll(); }
function setFilter(cat,btn){ filterCat=cat; document.querySelectorAll('.filter-chip').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); renderAll(); }

function getSorted() {
  let arr=Object.entries(topics).map(([id,t])=>({id,...t}));
  if(filterCat!=='all') arr=arr.filter(t=>t.author===filterCat);
  if(sortMode==='votes') return arr.sort((a,b)=>(b.votes||0)-(a.votes||0));
  if(sortMode==='recent') return arr.sort((a,b)=>(b.ts||0)-(a.ts||0));
  if(sortMode==='alpha') return arr.sort((a,b)=>a.text.localeCompare(b.text));
  if(sortMode==='category') return arr.sort((a,b)=>(a.author||'').localeCompare(b.author||'')||(b.votes||0)-(a.votes||0));
  return arr;
}

// ── RENDER ────────────────────────────────────────
function renderAll(){ renderNormal(); renderPresenter(); }

function topicCardHTML(t, i, maxV) {
  const pct=Math.round(((t.votes||0)/maxV)*100);
  const voted=t.voters&&t.voters[myId];
  const rank=i===0&&(t.votes||0)>0?'🥇':(i+1);
  const ci=catInfo(t.author);
  const authorName=t.name||t.author||'Anonyme';
  return `<div class="topic-card">
    <div class="rank">${rank}</div>
    <div class="topic-body">
      <div class="topic-text">${esc(t.text)}</div>
      <div class="topic-meta">
        <span class="cat-tag ${ci.cls}">${ci.icon} ${esc(t.author||'Autre')}</span>
        <span class="author-chip">${esc(authorName)}</span>
        <span style="font-size:11px;color:var(--muted)">${timeAgo(t.ts)}</span>
      </div>
    </div>
    <div class="bar-wrap">
      <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="bar-count">${t.votes||0} vote${(t.votes||0)!==1?'s':''}</div>
    </div>
    <button class="vote-btn${voted?' voted':''}" onclick="vote('${t.id}')">
      <svg viewBox="0 0 24 24" fill="${voted?'currentColor':'none'}" stroke="currentColor" stroke-width="2">
        <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>
      </svg>
      ${voted?'Voté':'Voter'}
    </button>
    <button class="del-btn" onclick="deleteTopic('${t.id}')" title="Supprimer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
      </svg>
    </button>
  </div>`;
}

function renderNormal() {
  const list=document.getElementById('topics-list');
  const sorted=getSorted();
  if(!sorted.length){
    list.innerHTML='<div class="empty">Aucun sujet pour ce filtre.<br>Proposez le premier !</div>';
    return;
  }
  const maxV=Math.max(...sorted.map(t=>t.votes||0),1);

  if(sortMode==='category') {
    // group by category
    const groups={};
    const ORDER=["Architecture & Engineering","IA & Analytics","Gouvernance & Qualité","Tendances & Stratégie","Autre"];
    sorted.forEach(t=>{ const k=t.author||'Autre'; if(!groups[k])groups[k]=[]; groups[k].push(t); });
    let html='';
    ORDER.forEach(cat=>{
      if(!groups[cat]||!groups[cat].length) return;
      const ci=catInfo(cat);
      const items=groups[cat];
      html+=`<div class="cat-group">
        <div class="cat-group-header">
          <span class="cat-tag ${ci.cls}">${ci.icon} ${esc(cat)}</span>
          <span class="cat-group-count">${items.length} sujet${items.length>1?'s':''}</span>
        </div>
        <div class="topics">
          ${items.map((t,i)=>topicCardHTML(t,i,maxV)).join('')}
        </div>
      </div>`;
    });
    // unknown cats
    Object.keys(groups).filter(k=>!ORDER.includes(k)).forEach(cat=>{
      const ci=catInfo(cat);
      html+=`<div class="cat-group"><div class="cat-group-header"><span class="cat-tag ${ci.cls}">${ci.icon} ${esc(cat)}</span></div><div class="topics">${groups[cat].map((t,i)=>topicCardHTML(t,i,maxV)).join('')}</div></div>`;
    });
    list.innerHTML=html;
  } else {
    list.innerHTML=`<div class="topics">${sorted.map((t,i)=>topicCardHTML(t,i,maxV)).join('')}</div>`;
  }
}

function renderPresenter() {
  const list=document.getElementById('presenter-list');
  const arr=Object.entries(topics).map(([id,t])=>({id,...t})).sort((a,b)=>(b.votes||0)-(a.votes||0));
  const maxV=arr.length?Math.max(...arr.map(t=>t.votes||0),1):1;
  if(!arr.length){ list.innerHTML='<div class="empty">En attente de sujets…</div>'; return; }
  const ci=t=>catInfo(t.author||'Autre');
  list.innerHTML=arr.map((t,i)=>{
    const pct=Math.round(((t.votes||0)/maxV)*100);
    const rank=i===0&&(t.votes||0)>0?'🥇':'#'+(i+1);
    return `<div class="presenter-topic${i===0&&(t.votes||0)>0?' top1':''}">
      <div class="presenter-rank">${rank}</div>
      <div style="flex:1;min-width:0">
        <div class="presenter-text">${esc(t.text)}</div>
        <div style="margin-top:6px"><span class="cat-tag ${ci(t).cls}">${ci(t).icon} ${esc(t.author||'Autre')}</span></div>
      </div>
      <div class="presenter-bar-wrap">
        <div class="presenter-bar-bg"><div class="presenter-bar-fill" style="width:${pct}%"></div></div>
        <div style="font-size:11px;color:var(--muted);text-align:right">${esc(t.name||'?')}</div>
      </div>
      <div class="presenter-votes">${t.votes||0}</div>
    </div>`;
  }).join('');
}

function updateStats() {
  const arr=Object.values(topics);
  document.getElementById('st-topics').textContent=arr.length;
  document.getElementById('st-votes').textContent=arr.reduce((s,t)=>s+(t.votes||0),0);
  const v=new Set(); arr.forEach(t=>{if(t.voters)Object.keys(t.voters).forEach(x=>v.add(x));});
  document.getElementById('st-voters').textContent=v.size;
}

// ── VIEW SWITCH ───────────────────────────────────
function switchView(mode,btn) {
  document.querySelectorAll('.view-toggle button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('normal-view').style.display=mode==='normal'?'':'none';
  document.getElementById('presenter-view').style.display=mode==='presenter'?'':'none';
}

// ── UTILS ─────────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function timeAgo(ts){ if(!ts)return''; const s=Math.floor((Date.now()-ts)/1000); if(s<60)return'À l\'instant'; const m=Math.floor(s/60); if(m<60)return`il y a ${m} min`; return`il y a ${Math.floor(m/60)}h`; }
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2500); }
function copySessionLink(){ const url=window.location.href.split('?')[0]+'?session='+encodeURIComponent(sessionCode); navigator.clipboard.writeText(url).then(()=>toast('Lien copié ! 🔗')); }

document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&document.activeElement?.id==='new-topic') addTopic(); });
setInterval(()=>renderNormal(),30000);
</script>
</body>
